# Push a tag like v1.2.0 and GitHub builds the zip and publishes the release.
# The app's "Update" button and get.ps1 pick up the newest release automatically.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: ./build-release.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          if (Test-Path $notes) {
            gh release create $tag (Get-Item dist/*.zip).FullName --title "Taskbar Groups+ $($tag.TrimStart('v'))" --notes-file $notes
          } else {
            gh release create $tag (Get-Item dist/*.zip).FullName --title "Taskbar Groups+ $($tag.TrimStart('v'))" --generate-notes
          }
